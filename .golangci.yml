version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: web/node_modules
        linters:
          - govet
          - errcheck
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
